<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Website Sementara Tidak Aktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#232b36;
  --ink:#e8edf3; --muted:#8b97a7; --gold:#d4a24e; --gold-soft:#2a2113;
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, var(--bg) 55%);color:var(--ink);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.55}
.card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px 32px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.badge{width:60px;height:60px;border-radius:16px;background:var(--gold-soft);border:1px solid #3a2f17;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.badge svg{width:30px;height:30px;stroke:var(--gold)}
h1{font-size:23px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
p{margin:0 auto;color:var(--muted);font-size:15px;max-width:40ch}
.divider{height:1px;background:var(--line);margin:28px 0 20px}
.credit{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.cta{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:left;text-decoration:none;transition:border-color .2s,background .2s}
.cta:hover{border-color:var(--gold);background:#1b212b}
.cta .t{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta .b{font-weight:700;color:var(--ink);font-size:15px}
.cta .s{color:var(--muted);font-size:13px;margin-top:3px}
.cta .arrow{color:var(--gold);font-weight:700;font-size:18px;flex:none}
.brand{font-weight:800;color:var(--gold)}
.foot{margin-top:18px;font-size:11.5px;color:#5c6775}
@media (max-width:420px){.card{padding:32px 22px 24px}h1{font-size:20px}}
</style>
</head>
<body>
<main class="card">
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  </div>
  <h1>Website Sementara Tidak Aktif</h1>
  <p>Mohon maaf, halaman ini sedang tidak dapat diakses untuk sementara karena proses administrasi. Silakan kembali lagi nanti.</p>

  <div class="divider"></div>

  <div class="credit">Website ini dibuat oleh</div>
  <a class="cta" href="https://www.hammad.studio" target="_blank" rel="noopener">
    <div class="t">
      <div>
        <div class="b"><span class="brand">Hammad Studio</span></div>
        <div class="s">Jasa pembuatan website profesional untuk usahamu</div>
      </div>
      <div class="arrow" aria-hidden="true">&rarr;</div>
    </div>
  </a>
  <div class="foot">Butuh website untuk bisnismu? Kunjungi hammad.studio</div>
</main>
</body>
</html>
